[project]
name = "ariabot"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "custodia-sdk[fastapi]>=0.1.4",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-litellm>=0.7.1",
    "langchain-qdrant>=1.1.0",
    "langgraph>=1.2.11",
    "litellm>=1.63.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.12.0",
    "rank-bm25>=0.2.2",
    "trafilatura>=2.0.0",
    "uvicorn[standard]>=0.52.2",
]

[dependency-groups]
dev = [
    "fastembed>=0.8.0",
    "gradio>=6.24.0",
    "instructor>=1.15.4",
    "pytest>=8.3.0",
    "ragas>=0.4.3",
    "requests>=2.34.2",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
markers = [
    "eval: slow RAG quality eval hitting Qdrant + DeepInfra (deselect with -m 'not eval')",
]
addopts = "-m 'not eval'"

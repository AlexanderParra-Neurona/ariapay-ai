services:
  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 5

  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      EMBED_MODEL: ${EMBED_MODEL}
      CHAT_MODEL: ${CHAT_MODEL}
    volumes:
      - ./scripts/pull_models.sh:/pull_models.sh:ro
    entrypoint: ["sh", "/pull_models.sh"]
    depends_on:
      ollama:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  qdrant-init:
    image: curlimages/curl:latest
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ariapay_docs
      EMBED_DIM: 4096
    volumes:
      - ./scripts/init_qdrant.sh:/init_qdrant.sh:ro
    entrypoint: ["sh", "/init_qdrant.sh"]
    depends_on:
      qdrant:
        condition: service_healthy

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL}
      EMBED_MODEL: ${EMBED_MODEL}
      EMBED_DIM: 4096
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ariapay_docs
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      qdrant-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis-commander:
    image: rediscommander/redis-commander:latest
    platform: linux/amd64
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  ollama_data:
  qdrant_data:

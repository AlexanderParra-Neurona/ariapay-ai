x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  frontend:
  backend:
    internal: true

services:
  app:
    build: .
    restart: unless-stopped
    networks:
      - frontend
      - backend
      - default
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      ARIAPAY_API_URL: ${ARIAPAY_API_URL}
      DEEPINFRA_API_TOKEN: ${DEEPINFRA_API_TOKEN}
      DEEPINFRA_CHAT_MODEL: ${DEEPINFRA_CHAT_MODEL}
      DEEPINFRA_EMBED_MODEL: ${DEEPINFRA_EMBED_MODEL}
      DEEPINFRA_EMBED_DIM: ${DEEPINFRA_EMBED_DIM}
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    volumes:
      - ./.llm-provider:/app/.llm-provider:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s
    logging: *default-logging
    cpus: "2"
    mem_limit: 1g

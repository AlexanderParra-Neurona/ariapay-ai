services:
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 5

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL}
    volumes:
      - ./docker/pull_models.sh:/pull_models.sh:ro
    entrypoint: ["sh", "/pull_models.sh"]
    depends_on:
      ollama:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  qdrant-init:
    image: curlimages/curl:latest
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}
      OLLAMA_EMBED_DIM: ${OLLAMA_EMBED_DIM}
      DEEPINFRA_EMBED_DIM: ${DEEPINFRA_EMBED_DIM}
    volumes:
      - ./docker/init_qdrant.sh:/init_qdrant.sh:ro
      - ./.llm-provider:/.llm-provider:ro
    entrypoint: ["sh", "/init_qdrant.sh"]
    depends_on:
      qdrant:
        condition: service_healthy

  qdrant-ingest:
    build: .
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL}
      OLLAMA_EMBED_DIM: ${OLLAMA_EMBED_DIM}
      DEEPINFRA_API_TOKEN: ${DEEPINFRA_API_TOKEN}
      DEEPINFRA_CHAT_MODEL: ${DEEPINFRA_CHAT_MODEL}
      DEEPINFRA_EMBED_MODEL: ${DEEPINFRA_EMBED_MODEL}
      DEEPINFRA_EMBED_DIM: ${DEEPINFRA_EMBED_DIM}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}
    volumes:
      - ./.llm-provider:/app/.llm-provider:ro
      - ./data:/app/data
    entrypoint: ["uv", "run", "python", "scripts/ingest_qdrant.py"]
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
        required: false
      qdrant-init:
        condition: service_completed_successfully

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      ARIAPAY_API_URL: ${ARIAPAY_API_URL}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL}
      OLLAMA_EMBED_DIM: ${OLLAMA_EMBED_DIM}
      DEEPINFRA_API_TOKEN: ${DEEPINFRA_API_TOKEN}
      DEEPINFRA_CHAT_MODEL: ${DEEPINFRA_CHAT_MODEL}
      DEEPINFRA_EMBED_MODEL: ${DEEPINFRA_EMBED_MODEL}
      DEEPINFRA_EMBED_DIM: ${DEEPINFRA_EMBED_DIM}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-web:3000}
    volumes:
      - ./.llm-provider:/app/.llm-provider:ro
    depends_on:
      ollama:
        condition: service_healthy
        required: false
      ollama-pull:
        condition: service_completed_successfully
        required: false
      qdrant:
        condition: service_healthy
      qdrant-init:
        condition: service_completed_successfully
      qdrant-ingest:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_data:

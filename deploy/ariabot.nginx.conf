# Copy to /etc/nginx/sites-available/ariabot on the VM, symlink into sites-enabled,
# then run certbot (see deploy/README.md) — certbot rewrites this file in place to add
# the TLS server block, so this starting point only needs the plain HTTP block below.
# APP_PORT_PLACEHOLDER must match APP_PORT in .env (default 8000; change both if 8000
# is already used by another service on this VM).

server {
    listen 80;
    server_name STAGING_DOMAIN_PLACEHOLDER;

    location / {
        proxy_pass http://127.0.0.1:APP_PORT_PLACEHOLDER;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /v1/chat runs a classifier + retrieval + answer LLM chain, matching the
        # client's own 300s budget (app/constants.py HTTP_TIMEOUT_CHAT_SECONDS) —
        # nginx's 60s default otherwise cuts the connection before the app replies.
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
